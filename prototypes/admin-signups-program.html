<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin-common.css">
  <title>Programs Admin – Track progress of kadets</title>
  <style>
    /* Page-specific: this page's filter dropdown hides the native chevron */
    .filter-dropdown {
      appearance: none;
      background-image: none;
      padding-right: 12px;
    }

    .participant-email {
      font-size: 13px;
      color: #6e6e73;
    }

    /* Participant info columns (University, Degree, Location) */
    .university-th, .university-td,
    .degree-th, .degree-td,
    .location-th, .location-td {
      min-width: 160px;
      max-width: 240px;
    }
    .university-td, .degree-td, .location-td {
      font-size: 13px;
      color: #1d1d1f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Info filter button */
    .info-filter-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .info-filter-btn.filter-active {
      background: #0066cc;
      color: white;
      border-color: #0066cc;
    }
    .info-filter-badge {
      display: none;
      background: white;
      color: #0066cc;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 6px;
      line-height: 1.4;
    }
    .info-filter-btn.filter-active .info-filter-badge {
      display: inline-block;
    }

    /* Info filter modal — wider, three-column layout */
    .modal-content-wide {
      max-width: 720px;
      width: 90vw;
    }
    .info-filter-sections {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    .info-filter-section {
      padding: 0 20px 4px;
      border-right: 1px solid #f0f0f0;
    }
    .info-filter-section:first-child {
      padding-left: 0;
    }
    .info-filter-section:last-child {
      padding-right: 0;
      border-right: none;
    }
    .info-filter-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-filter-section-title {
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
    }
    .info-filter-section-actions {
      display: flex;
      gap: 4px;
    }
    .info-filter-quick-btn {
      font-size: 11px;
      color: #0066cc;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .info-filter-quick-btn:hover {
      background: #e8f0fb;
    }
    .info-filter-divider {
      font-size: 11px;
      color: #d2d2d7;
      line-height: 1;
    }
    .info-filter-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 260px;
      overflow-y: auto;
    }
    .info-filter-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #1d1d1f;
      cursor: pointer;
      padding: 5px 6px;
      border-radius: 5px;
      line-height: 1.4;
    }
    .info-filter-option:hover {
      background: #f5f5f7;
    }
    .info-filter-option input[type="checkbox"] {
      margin-top: 1px;
      flex-shrink: 0;
      accent-color: #0066cc;
    }
    .info-filter-option.excluded {
      color: #86868b;
      text-decoration: line-through;
    }

    /* Search input in controls bar */
    .search-input {
      padding: 7px 10px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 13px;
      color: #1d1d1f;
      background: white;
      width: 220px;
      outline: none;
    }
    .search-input:focus {
      border-color: #0066cc;
    }
    .search-input::placeholder {
      color: #86868b;
    }

    /* Toggle switch (Program Configuration) */
    .config-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .participant-info-toggle {
      flex-shrink: 0;
      justify-content: flex-start;
    }
    .config-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .config-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .config-switch-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #d2d2d7;
      border-radius: 24px;
      transition: background 0.2s;
    }
    .config-switch-slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .config-switch input:checked + .config-switch-slider {
      background: #0066cc;
    }
    .config-switch input:checked + .config-switch-slider::before {
      transform: translateX(20px);
    }

    /* Attendance column(s) — shape depends on the configured program
       duration (see .config-radio[name="duration"] in the modal below). */
    .attendance-th,
    .attendance-td {
      text-align: left;
      min-width: 140px;
    }

    .attendance-day-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .attendance-day-row-label {
      font-size: 13px;
      font-weight: 600;
      color: #6e6e73;
    }

    .attendance-th-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #6e6e73;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Connected segmented button group — one button per event day, all
       sharing one border line via negative margin overlap. Only the two
       end buttons get outer corner rounding. */
    .attendance-day-group {
      display: inline-flex;
    }

    .attendance-day-btn {
      padding: 6px 10px;
      min-width: 32px;
      border: 1px solid #d2d2d7;
      background: white;
      color: #1d1d1f;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .attendance-day-btn + .attendance-day-btn {
      margin-left: -1px;
    }

    .attendance-day-group .attendance-day-btn:first-child {
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
    }

    .attendance-day-group .attendance-day-btn:last-child {
      border-top-right-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .attendance-day-btn {
      position: relative;
    }

    .attendance-day-btn:hover {
      background: #f5f5f7;
      z-index: 1;
    }

    .attendance-day-btn.filled {
      background: #10b981;
      color: white;
      border-color: #10b981;
      z-index: 1;
    }

    .attendance-day-btn.filled:hover {
      background: #0ea472;
    }

    /* Custom global tooltip styled similarly to standard tooltips,
       rendered at body level to escape overflow clipping in scrollable body. */
    .custom-tooltip {
      position: fixed;
      padding: 5px 9px;
      background: #1d1d1f;
      color: white;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      border-radius: 4px;
      z-index: 100000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .custom-tooltip.show {
      opacity: 1;
    }

    /* Submissions column — same connected-button pattern as Attendance,
       but orange, and each button represents a task rather than a day. */
    .submission-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .submission-row-label {
      font-size: 13px;
      font-weight: 600;
      color: #6e6e73;
    }

    .submission-group {
      display: inline-flex;
    }

    .submission-btn {
      padding: 6px 10px;
      min-width: 32px;
      border: 1px solid #d2d2d7;
      background: white;
      color: #1d1d1f;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }

    .submission-btn + .submission-btn {
      margin-left: -1px;
    }

    .submission-group .submission-btn:first-child {
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
    }

    .submission-group .submission-btn:last-child {
      border-top-right-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .submission-btn:hover {
      background: #f5f5f7;
      z-index: 1;
    }

    .submission-btn.filled {
      background: #f59e0b;
      color: white;
      border-color: #f59e0b;
      z-index: 1;
    }

    .submission-btn.filled:hover {
      background: #d97706;
    }

    /* Helper tooltips on the status pill + its dropdown options, explaining
       what each status means. Options get a side tooltip (they're stacked
       vertically, so "above" would collide with neighboring rows); the
       pill itself keeps the default "above" placement, but is suppressed
       while its own dropdown is open to avoid a double tooltip. */
    .status-option {
      position: relative;
    }



    .config-days-field {
      margin-top: 12px;
    }

    .config-days-input {
      padding: 8px 12px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 14px;
      width: 80px;
    }

    /* Checkbox styling (row bulk-selection) */
    .checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0066cc;
    }

    .select-col {
      width: 40px;
    }

    /* Page shell: the page itself doesn't scroll — only the table's row
       body does. Header/controls above the table and the footer below it
       stay fixed on screen; .table-scroll is the one scrollable region. */
    body {
      height: 100vh;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-header,
    .controls {
      flex-shrink: 0;
    }

    .table-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    /* Header lives in its own table, outside .table-scroll entirely, so
       the scrollbar only ever spans the row body — not the header. Widths
       are synced to the body table's actual columns via JS (see
       syncHeaderWidths), since the header table has no data of its own to
       size against. */
    .table-head-scroll {
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }

    .table-head-table {
      width: 100%;
      min-width: max-content;
      table-layout: fixed;
      border-collapse: collapse;
      background: #f5f5f7;
    }

    .scrollbar-spacer {
      padding: 0;
      border: none;
    }

    .table-footer {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-top: 1px solid #e5e7eb;
      background: #fafafa;
      font-size: 13px;
      color: #6e6e73;
      position: relative;
      z-index: 1;
    }

    .footer-selected-count {
      color: #0066cc;
      font-weight: 600;
    }



    /* Selected-row highlight */
    #signups-table tbody tr:has(.row-select:checked) {
      background: #eff6ff;
    }

    /* Row click opens the participant detail modal. Selection itself only
       happens via the checkbox column. */
    #signups-table tbody tr {
      cursor: pointer;
    }

    .created-at-cell,
    .updated-at-cell {
      white-space: nowrap;
      color: #6e6e73;
      font-size: 13px;
      line-height: 1.4;
    }
    .reject-reason-cell {
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #6e6e73;
      font-size: 13px;
      line-height: 1.4;
    }
    .time-part {
      color: #86868b;
      font-size: 12px;
    }


    /* Participant detail modal */
    #historyModal .modal-content {
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .status-pill.small {
      padding: 3px 10px;
      font-size: 11px;
    }
    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 8px 4px;
      border-bottom: 1px solid #f0f0f2;
    }
    .detail-label {
      font-size: 13px;
      color: #6e6e73;
      flex-shrink: 0;
    }
    .detail-value {
      font-size: 14px;
      color: #1d1d1f;
      text-align: right;
    }
    .detail-row-widget {
      align-items: center;
    }
    .detail-chip-row {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .detail-chip {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid #d2d2d7;
      background: white;
      color: #86868b;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .detail-chip.filled-attendance {
      background: #10b981;
      color: white;
      border-color: #10b981;
    }
    .detail-chip.filled-submission {
      background: #f59e0b;
      color: white;
      border-color: #f59e0b;
    }
    .detail-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: #f0f0f2;
      color: #6e6e73;
    }
    .detail-badge.present {
      background: #10b981;
      color: white;
    }
    .detail-section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6e6e73;
      margin-top: 28px;
      margin-bottom: 10px;
    }
    #detailList > .detail-section-title:first-child {
      margin-top: 0;
    }
    .detail-section-title.collapsible {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .detail-section-chevron {
      font-size: 11px;
      color: #86868b;
      transition: transform 0.15s;
    }
    .detail-section-title.collapsed .detail-section-chevron {
      transform: rotate(-90deg);
    }
    .detail-section-title.collapsed + * {
      display: none;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 360px;
      overflow-y: auto;
    }
    .history-entry {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid #f0f0f2;
    }
    .history-entry:last-child {
      border-bottom: none;
    }
    .history-entry-main {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .history-status {
      font-size: 12px;
      font-weight: 600;
      color: #1d1d1f;
      white-space: nowrap;
    }
    .history-status.history-email {
      font-weight: 500;
      color: #6e6e73;
    }
    .history-admin {
      font-size: 11px;
      color: #6e6e73;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-timestamp {
      font-size: 11px;
      color: #86868b;
      white-space: nowrap;
      text-align: right;
    }
    .history-empty {
      color: #86868b;
      font-size: 14px;
      padding: 16px 4px;
      text-align: center;
    }

    tr.hidden {
      display: none !important;
    }

    /* Sortable Column Headers */
    .sortable-th {
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, color 0.15s;
    }

    .sortable-th:hover {
      background: #ebebeb;
      color: #1d1d1f;
    }

    .sortable-th[data-sort-dir="asc"],
    .sortable-th[data-sort-dir="desc"] {
      color: #0066cc;
    }

    .sort-icon {
      display: inline-block;
      margin-left: 4px;
      font-size: 11px;
      color: #86868b;
      font-weight: normal;
      transition: color 0.15s;
    }

    .sortable-th:hover .sort-icon {
      color: #1d1d1f;
    }

    .sortable-th[data-sort-dir="asc"] .sort-icon,
    .sortable-th[data-sort-dir="desc"] .sort-icon {
      color: #0066cc;
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- Main Content -->
<div class="container">
  <div class="page-header">
    <div class="page-header-content">
      <h1 class="page-title">Programs Admin</h1>
      <p class="page-subtitle">Track the progress of kadets for the program {program_name}</p>
    </div>
    <button class="config-btn" onclick="openModal('configModal')" title="Program settings">⚙️</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="filter-section">
      <span class="filter-label">Filter by Status:</span>
      <select class="filter-dropdown" id="statusFilter">
        <option value="all">All signups</option>
        <option value="interested">Interested</option>
        <option value="applied">Applied</option>
        <option value="approved">Approved</option>
        <option value="completed">Completed</option>
        <option value="dropped-out">Dropped out</option>
        <option value="rejected">Rejected</option>
      </select>
      <input type="search" class="search-input" id="searchFilter" placeholder="Search name, university, degree, location…">
      <button class="btn-outline info-filter-btn" id="infoFilterBtn" onclick="openInfoFilterModal()">
        Filter by info <span class="info-filter-badge" id="infoFilterBadge"></span>
      </button>
      <div class="config-switch-row participant-info-toggle">
        <label class="config-label" for="participantInfoToggle" style="margin-bottom: 0;">Show participant info</label>
        <label class="config-switch">
          <input type="checkbox" id="participantInfoToggle">
          <span class="config-switch-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Signups Table -->
  <div class="table-wrapper">
  <div class="table-head-scroll">
  <table id="tableHead" class="table-head-table">
    <thead>
      <tr id="headRow">
        <th class="select-col"><input type="checkbox" class="checkbox" id="selectAllRows"></th>
        <th class="sortable-th" data-sort-key="name">Name <span class="sort-icon">↕</span></th>
        <th class="sortable-th" data-sort-key="status">Status <span class="sort-icon">↕</span></th>
        <th class="created-at-th sortable-th" data-sort-key="createdAt">Created At <span class="sort-icon">↕</span></th>
        <th class="updated-at-th sortable-th" data-sort-key="updatedAt">Updated At <span class="sort-icon">↕</span></th>
        <th class="reject-reason-th">Reject Reason</th>
        <th class="scrollbar-spacer" id="scrollbarSpacer"></th>
      </tr>
    </thead>
  </table>
  </div>
  <div class="table-scroll">
  <table id="signups-table">
    <tbody>
    </tbody>
  </table>
  </div>
  <div class="table-footer" id="tableFooter">
    <span id="footerText">10 rows</span>
  </div>
  </div>
</div>

<!-- Config Modal -->
<div id="configModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Program Configuration</h2>
      <button class="modal-close" onclick="closeModal('configModal')">✕</button>
    </div>

    <div class="config-group">
      <label class="config-label">Duration</label>
      <div class="config-options">
        <input type="radio" id="duration-single" name="duration" class="config-radio" value="single-day">
        <label for="duration-single" class="config-radio-label">Single-day</label>

        <input type="radio" id="duration-multi" name="duration" class="config-radio" value="multi-day">
        <label for="duration-multi" class="config-radio-label">Multi-day</label>

        <input type="radio" id="duration-none" name="duration" class="config-radio" value="no-attendance" checked>
        <label for="duration-none" class="config-radio-label">No attendance</label>
      </div>
      <div class="config-days-field" id="configDaysField" style="display: none;">
        <label class="config-label" for="configDaysCount">Number of days</label>
        <input type="number" id="configDaysCount" class="config-days-input" min="2" max="31" value="7">
      </div>
    </div>

    <div class="config-group">
      <label class="config-label">Deliverables</label>
      <div class="config-options">
        <input type="radio" id="submissions-yes" name="submissions" class="config-radio" value="has-submissions">
        <label for="submissions-yes" class="config-radio-label">Has submissions</label>

        <input type="radio" id="submissions-no" name="submissions" class="config-radio" value="no-submissions" checked>
        <label for="submissions-no" class="config-radio-label">No submissions</label>
      </div>
      <div class="config-days-field" id="configSubmissionsField" style="display: none;">
        <label class="config-label" for="configSubmissionsCount">Number of submissions</label>
        <input type="number" id="configSubmissionsCount" class="config-days-input" min="1" max="20" value="3">
      </div>
    </div>
    
    <div class="config-group">
      <label class="config-label">Format</label>
      <div class="config-options">
        <input type="radio" id="format-online" name="format" class="config-radio" value="online" checked>
        <label for="format-online" class="config-radio-label">Online</label>

        <input type="radio" id="format-onsite" name="format" class="config-radio" value="onsite">
        <label for="format-onsite" class="config-radio-label">Onsite</label>

        <input type="radio" id="format-hybrid" name="format" class="config-radio" value="hybrid">
        <label for="format-hybrid" class="config-radio-label">Hybrid</label>
      </div>
    </div>

    <div class="modal-actions">

<script>
  // Parse program name from URL query parameters
  const urlParams = new URLSearchParams(window.location.search);
  const programName = urlParams.get('program') || 'Software Engineering Boot Camp';
  document.querySelector('.page-subtitle').textContent = `Track the progress of kadets for the program ${programName}`;

  // Declared before the row-rendering map below, which calls
  // truncateRejectReason() (defined later in this script, but that
  // function's body reads this const, so it must exist before then).
  const REJECT_REASON_PREVIEW_LENGTH = 90;

  // Render rows synchronously before admin-common.js loads
  const tbody = document.querySelector('#signups-table tbody');
  tbody.innerHTML = participantsData.map((p, index) => `
      <tr data-row-id="${p.id}" data-status="${p.status}" data-original-index="${index}">
        <td class="select-col"><input type="checkbox" class="checkbox row-select"></td>
        <td class="participant-cell">
          <div class="participant-cell">
            <div><span class="participant-name">${p.name}</span></div>
            <div><span class="participant-email">${p.email}</span></div>
          </div>
        </td>
        <td>
          <span class="status-pill editable" data-status="${p.status}" onclick="toggleStatusDropdown(event)">
            <span class="status-pill-label">${p.status === 'dropped-out' ? 'Dropped out' : p.status.charAt(0).toUpperCase() + p.status.slice(1)}</span>
            <div class="status-dropdown" data-statuses="interested,applied,approved,completed,dropped-out,rejected">
              <div class="status-option" data-status="interested">Interested</div>
              <div class="status-option" data-status="applied">Applied</div>
              <div class="status-option" data-status="approved">Approved</div>
              <div class="status-option" data-status="completed">Completed</div>
              <div class="status-option" data-status="dropped-out">Dropped out</div>
              <div class="status-option" data-status="rejected">Rejected</div>
            </div>
          </span>
        </td>
        <td class="created-at-cell">
          <div>${p.createdAt.date}</div>
          <div class="time-part">${p.createdAt.time}</div>
        </td>
        <td class="updated-at-cell">
          <div>${p.updatedAt.date}</div>
          <div class="time-part">${p.updatedAt.time}</div>
        </td>
        <td class="reject-reason-cell">${p.status === 'rejected' ? truncateRejectReason(p.rejectReason || '') : '—'}</td>
      </tr>
  `).join('');

  // Per-participant status change log, keyed by row id. Seeded from mock
  // `history` where provided; participants without one get a single entry
  // synthesized from their current status, since a real change never happened.
  const CURRENT_ADMIN = 'you@kadakareer.com';
  const statusHistoryStore = {};
  participantsData.forEach(p => {
    // Interested/applied are self-service — the applicant did this via the
    // public sign-up flow, not an admin, so they're the "admin" of record.
    const isSelfService = p.status === 'interested' || p.status === 'applied';
    statusHistoryStore[p.id] = p.history && p.history.length
      ? p.history.slice()
      : [{ status: p.status, admin: isSelfService ? p.email : 'System', date: p.createdAt.date, time: p.createdAt.time }];
  });

  // Rejection reason per participant, keyed by row id. Seeded from mock
  // `rejectReason` where provided; kept even if the status later changes
  // away from Rejected, so flipping back doesn't lose it.
  const rejectReasonStore = {};
  participantsData.forEach(p => {
    rejectReasonStore[p.id] = p.rejectReason || '';
  });

  // Cell shows a short preview only — no title attribute, since that would
  // add a native hover tooltip that's redundant with the participant detail
  // modal (opened by clicking the row), which already shows the full reason.
  function truncateRejectReason(text) {
    if (text.length <= REJECT_REASON_PREVIEW_LENGTH) return text;
    return text.slice(0, REJECT_REASON_PREVIEW_LENGTH) + '…';
  }

  function updateRejectReasonCell(row, status) {
    const cell = row.querySelector('.reject-reason-cell');
    if (!cell) return;

    if (status !== 'rejected') {
      cell.textContent = '—';
      return;
    }

    const existing = rejectReasonStore[row.dataset.rowId] || '';
    const reason = prompt('Reason for rejection:', existing);
    rejectReasonStore[row.dataset.rowId] = reason || '';
    cell.textContent = truncateRejectReason(reason || '');
  }

  // Tracks which participant's detail modal is currently open, if any — a
  // status change made from inside the modal isn't inside a <tr>, so this
  // is how that click gets linked back to its underlying row.
  let currentDetailRow = null;
</script>
<script src="assets/admin-common.js"></script>
<script>
  function formatDateTimeParts(date) {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const month = months[date.getMonth()];
    const day = date.getDate();
    const year = date.getFullYear();
    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; // the hour '0' should be '12'
    const hoursStr = String(hours).padStart(2, '0');
    return { date: `${month} ${day}, ${year}`, time: `${hoursStr}:${minutes} ${ampm}` };
  }

  function formatDateTimeHTML(date) {
    const parts = formatDateTimeParts(date);
    return `<div>${parts.date}</div><div class="time-part">${parts.time}</div>`;
  }

  function updateRowTimestamp(row) {
    if (!row) return;
    const updatedAtCell = row.querySelector('.updated-at-cell');
    if (updatedAtCell) {
      updatedAtCell.innerHTML = formatDateTimeHTML(new Date());
    }
  }

  const CONFIG_KEY = 'kadakareer_program_config';

  const CONFIG_DEFAULTS = {
    duration: 'no-attendance',
    format: 'online',
    submissions: 'no-submissions',
    daysCount: 7,
    submissionsCount: 3,
    showParticipantInfo: false,
  };

  function loadConfig() {
    try {
      const stored = localStorage.getItem(CONFIG_KEY);
      return stored ? { ...CONFIG_DEFAULTS, ...JSON.parse(stored) } : { ...CONFIG_DEFAULTS };
    } catch {
      return { ...CONFIG_DEFAULTS };
    }
  }

  function applyConfigToModal(cfg) {
    document.querySelector(`input[name="duration"][value="${cfg.duration}"]`).checked = true;
    document.querySelector(`input[name="format"][value="${cfg.format}"]`).checked = true;
    document.querySelector(`input[name="submissions"][value="${cfg.submissions}"]`).checked = true;
    document.getElementById('configDaysCount').value = cfg.daysCount;
    document.getElementById('configSubmissionsCount').value = cfg.submissionsCount;
    document.getElementById('participantInfoToggle').checked = cfg.showParticipantInfo;
    document.getElementById('configDaysField').style.display = cfg.duration === 'multi-day' ? 'block' : 'none';
    document.getElementById('configSubmissionsField').style.display = cfg.submissions === 'has-submissions' ? 'block' : 'none';
  }

  function saveConfig() {
    const duration = document.querySelector('input[name="duration"]:checked').value;
    const format = document.querySelector('input[name="format"]:checked').value;
    const submissions = document.querySelector('input[name="submissions"]:checked').value;
    const daysCount = parseInt(document.getElementById('configDaysCount').value, 10) || 1;
    const submissionsCount = parseInt(document.getElementById('configSubmissionsCount').value, 10) || 1;
    const showParticipantInfo = document.getElementById('participantInfoToggle').checked;

    const cfg = { duration, format, submissions, daysCount, submissionsCount, showParticipantInfo };
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    refreshTableColumns(duration, daysCount, submissions === 'has-submissions', submissionsCount, showParticipantInfo);
    closeModal('configModal');
  }

  // "Show participant info" now lives in the filter row, not the config
  // modal — it applies immediately on toggle instead of waiting for Save.
  document.getElementById('participantInfoToggle').addEventListener('change', function() {
    const cfg = loadConfig();
    cfg.showParticipantInfo = this.checked;
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    refreshTableColumns(cfg.duration, cfg.daysCount, cfg.submissions === 'has-submissions', cfg.submissionsCount, cfg.showParticipantInfo);
  });

  // Show the "Number of days" field only when Multi-day is selected.
  document.querySelectorAll('input[name="duration"]').forEach(radio => {
    radio.addEventListener('change', function() {
      document.getElementById('configDaysField').style.display = this.value === 'multi-day' ? 'block' : 'none';
    });
  });

  // Show the "Number of submissions" field only when Deliverables = Has submissions.
  document.querySelectorAll('input[name="submissions"]').forEach(radio => {
    radio.addEventListener('change', function() {
      document.getElementById('configSubmissionsField').style.display = this.value === 'has-submissions' ? 'block' : 'none';
    });
  });

  /* Attendance tracker — Single-day is one checkbox column with a
     "select all". Multi-day is a connected segmented button group, one
     button per event day, inline in each row's own cell — clicking a
     button toggles that day's attendance for that person, and hovering
     shows the exact calendar date. No bulk/select-all here since the
     control is per-row, not per-column.

     Submissions is an independent column (Deliverables config), also a
     connected segmented button group, one button per task — hovering
     shows the task name/title. Attendance and Submissions are rebuilt
     together by refreshTableColumns() so column order stays stable no
     matter which config changes. */
  const PROGRAM_START_DATE = new Date(2026, 0, 5); // demo: Monday, Jan 5 2026

  function formatDayDate(dayIndex) {
    const d = new Date(PROGRAM_START_DATE);
    d.setDate(d.getDate() + dayIndex);
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  // Demo seed data for the Submissions column — 3 tasks by default.
  const SUBMISSION_TASKS = ['Week 1 Reflection', 'Midpoint Project', 'Final Submission'];

  function wireSelectAll(headerRow, rows, getChecked, setChecked) {
    const selectAll = headerRow.querySelector('.attendance-select-all');
    if (!selectAll) return;

    function refresh() {
      const states = Array.from(rows).map(getChecked);
      const allChecked = states.every(Boolean);
      const someChecked = states.some(Boolean);
      selectAll.checked = allChecked;
      selectAll.indeterminate = someChecked && !allChecked;
    }

    selectAll.addEventListener('change', function() {
      rows.forEach(row => setChecked(row, this.checked));
      refresh();
    });

    rows.forEach(row => {
      row.querySelector('.attendance-checkbox').addEventListener('change', refresh);
    });

    refresh();
  }

  function insertHeaderCell(headerRow, th) {
    const createdAtTh = headerRow.querySelector('.created-at-th');
    if (createdAtTh) {
      headerRow.insertBefore(th, createdAtTh);
    } else {
      const spacer = document.getElementById('scrollbarSpacer');
      headerRow.insertBefore(th, spacer);
    }
  }

  function insertBodyCell(row, td) {
    const createdAtTd = row.querySelector('.created-at-cell');
    if (createdAtTd) {
      row.insertBefore(td, createdAtTd);
    } else {
      row.appendChild(td);
    }
  }

  function renderAttendanceColumn(headerRow, rows, mode, daysCount) {
    const th = document.createElement('th');
    th.className = 'attendance-th sortable-th';
    th.dataset.sortKey = 'attendance';
    insertHeaderCell(headerRow, th);

    if (mode === 'multi-day') {
      th.innerHTML = 'Attendance <span class="sort-icon">↕</span>';

      rows.forEach(row => {
        const rowId = row.dataset.rowId;
        const record = attendanceData[rowId];
        const td = document.createElement('td');
        td.className = 'attendance-td';

        const wrapper = document.createElement('div');
        wrapper.className = 'attendance-day-row';

        const label = document.createElement('span');
        label.className = 'attendance-day-row-label';
        label.textContent = 'Day';
        wrapper.appendChild(label);

        const group = document.createElement('div');
        group.className = 'attendance-day-group';

        for (let i = 0; i < daysCount; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'attendance-day-btn';
          btn.textContent = String(i + 1);
          btn.dataset.tooltip = formatDayDate(i);
          if (record.days[i]) btn.classList.add('filled');

          btn.addEventListener('click', () => {
            record.days[i] = !record.days[i];
            btn.classList.toggle('filled', record.days[i]);
            updateRowTimestamp(row);
            if (currentSort.key && currentSort.dir !== 'none') sortRows();
          });

          group.appendChild(btn);
        }

        wrapper.appendChild(group);
        td.appendChild(wrapper);
        insertBodyCell(row, td);
      });

    } else {
      // single-day
      th.innerHTML = '<label class="attendance-th-label"><input type="checkbox" class="checkbox attendance-select-all" onclick="event.stopPropagation()"> Attendance</label> <span class="sort-icon">↕</span>';

      rows.forEach(row => {
        const rowId = row.dataset.rowId;
        const td = document.createElement('td');
        td.className = 'attendance-td';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.className = 'checkbox attendance-checkbox';
        input.checked = attendanceData[rowId].single;
        input.addEventListener('change', () => {
          attendanceData[rowId].single = input.checked;
          updateRowTimestamp(row);
          if (currentSort.key && currentSort.dir !== 'none') sortRows();
        });
        td.appendChild(input);
        insertBodyCell(row, td);
      });

      wireSelectAll(headerRow, rows,
        row => attendanceData[row.dataset.rowId].single,
        (row, val) => {
          if (attendanceData[row.dataset.rowId].single !== val) {
            attendanceData[row.dataset.rowId].single = val;
            row.querySelector('.attendance-checkbox').checked = val;
            updateRowTimestamp(row);
          }
        });
    }
  }

  function taskLabel(i) {
    return SUBMISSION_TASKS[i] || ('Task ' + (i + 1));
  }

  function renderSubmissionsColumn(headerRow, rows, submissionsCount) {
    const th = document.createElement('th');
    th.className = 'submissions-th sortable-th';
    th.dataset.sortKey = 'submissions';
    th.innerHTML = 'Submissions <span class="sort-icon">↕</span>';
    insertHeaderCell(headerRow, th);

    rows.forEach(row => {
      const rowId = row.dataset.rowId;
      const record = submissionsData[rowId];
      const td = document.createElement('td');
      td.className = 'submissions-td';

      const wrapper = document.createElement('div');
      wrapper.className = 'submission-row';

      const label = document.createElement('span');
      label.className = 'submission-row-label';
      label.textContent = 'Task';
      wrapper.appendChild(label);

      const group = document.createElement('div');
      group.className = 'submission-group';

      for (let i = 0; i < submissionsCount; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'submission-btn';
        btn.textContent = String(i + 1);
        btn.dataset.tooltip = taskLabel(i);
        if (record[i]) btn.classList.add('filled');

        btn.addEventListener('click', () => {
          record[i] = !record[i];
          btn.classList.toggle('filled', record[i]);
          updateRowTimestamp(row);
          if (currentSort.key && currentSort.dir !== 'none') sortRows();
        });

        group.appendChild(btn);
      }

      wrapper.appendChild(group);
      td.appendChild(wrapper);
      insertBodyCell(row, td);
    });
  }

  /* Table Column Sorting */
  // Default to Status descending so Rejected rows (last alphabetically)
  // surface at the top on load.
  let currentSort = {
    key: 'status',
    dir: 'desc' // 'none' -> 'asc' -> 'desc' -> 'none'
  };

  function updateSortHeaderUI() {
    document.querySelectorAll('#headRow .sortable-th').forEach(th => {
      const key = th.dataset.sortKey;
      const icon = th.querySelector('.sort-icon');
      if (key === currentSort.key && currentSort.dir !== 'none') {
        th.setAttribute('data-sort-dir', currentSort.dir);
        if (icon) icon.textContent = currentSort.dir === 'asc' ? ' ↑' : ' ↓';
      } else {
        th.removeAttribute('data-sort-dir');
        if (icon) icon.textContent = ' ↕';
      }
    });
  }

  function getRowValue(tr, key) {
    const rowId = tr.dataset.rowId;
    switch (key) {
      case 'name': {
        const nameEl = tr.querySelector('.participant-name');
        return nameEl ? nameEl.textContent.trim().toLowerCase() : '';
      }
      case 'status': {
        return (tr.dataset.status || '').toLowerCase();
      }
      case 'university': {
        const cell = tr.querySelector('.university-td');
        return cell ? cell.textContent.trim().toLowerCase() : '';
      }
      case 'degree': {
        const cell = tr.querySelector('.degree-td');
        return cell ? cell.textContent.trim().toLowerCase() : '';
      }
      case 'location': {
        const cell = tr.querySelector('.location-td');
        return cell ? cell.textContent.trim().toLowerCase() : '';
      }
      case 'attendance': {
        const att = attendanceData[rowId];
        if (!att) return 0;
        if (Array.isArray(att.days)) {
          return att.days.filter(Boolean).length;
        }
        return att.single ? 1 : 0;
      }
      case 'submissions': {
        const subs = submissionsData[rowId];
        if (!subs) return 0;
        return subs.filter(Boolean).length;
      }
      case 'createdAt': {
        const cell = tr.querySelector('.created-at-cell');
        if (!cell) return 0;
        const divs = cell.querySelectorAll('div');
        const dateStr = divs[0] ? divs[0].textContent.trim() : '';
        const timeStr = divs[1] ? divs[1].textContent.trim() : '';
        const parsed = Date.parse(`${dateStr} ${timeStr}`);
        return isNaN(parsed) ? 0 : parsed;
      }
      case 'updatedAt': {
        const cell = tr.querySelector('.updated-at-cell');
        if (!cell) return 0;
        const divs = cell.querySelectorAll('div');
        const dateStr = divs[0] ? divs[0].textContent.trim() : '';
        const timeStr = divs[1] ? divs[1].textContent.trim() : '';
        const parsed = Date.parse(`${dateStr} ${timeStr}`);
        return isNaN(parsed) ? 0 : parsed;
      }
      default:
        return '';
    }
  }

  function compareRows(a, b, key, dir) {
    const valA = getRowValue(a, key);
    const valB = getRowValue(b, key);

    let result = 0;
    if (typeof valA === 'number' && typeof valB === 'number') {
      result = valA - valB;
    } else {
      result = String(valA).localeCompare(String(valB), undefined, { numeric: true, sensitivity: 'base' });
    }

    if (result === 0) {
      const idxA = parseInt(a.dataset.originalIndex, 10) || 0;
      const idxB = parseInt(b.dataset.originalIndex, 10) || 0;
      result = idxA - idxB;
    }

    return dir === 'desc' ? -result : result;
  }

  function sortRows() {
    const tbody = document.querySelector('#signups-table tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));

    if (!currentSort.key || currentSort.dir === 'none') {
      rows.sort((a, b) => {
        const idxA = parseInt(a.dataset.originalIndex, 10) || 0;
        const idxB = parseInt(b.dataset.originalIndex, 10) || 0;
        return idxA - idxB;
      });
    } else {
      rows.sort((a, b) => compareRows(a, b, currentSort.key, currentSort.dir));
    }

    rows.forEach(row => tbody.appendChild(row));

    updateSelectionUI();
    syncHeaderWidths();
  }

  function handleHeaderClick(sortKey) {
    if (currentSort.key === sortKey) {
      if (currentSort.dir === 'none') {
        currentSort.dir = 'asc';
      } else if (currentSort.dir === 'asc') {
        currentSort.dir = 'desc';
      } else {
        currentSort.key = null;
        currentSort.dir = 'none';
      }
    } else {
      currentSort.key = sortKey;
      currentSort.dir = 'asc';
    }

    updateSortHeaderUI();
    sortRows();
  }

  document.getElementById('headRow').addEventListener('click', function(e) {
    if (e.target.closest('.checkbox, label, input')) return;

    const th = e.target.closest('.sortable-th');
    if (!th) return;

    const sortKey = th.dataset.sortKey;
    if (!sortKey) return;

    handleHeaderClick(sortKey);
  });

  const participantInfoMap = {};
  participantsData.forEach(p => {
    participantInfoMap[p.id] = { school: p.school, course: p.course, location: p.location };
  });

  function renderParticipantInfoColumns(headerRow, rows) {
    const cols = [
      { key: 'university', label: 'University', cls: 'university', field: 'school' },
      { key: 'degree',     label: 'Degree',     cls: 'degree',     field: 'course' },
      { key: 'location',   label: 'Location',   cls: 'location',   field: 'location' },
    ];

    cols.forEach(({ key, label, cls, field }) => {
      const th = document.createElement('th');
      th.className = `${cls}-th sortable-th`;
      th.dataset.sortKey = key;
      th.innerHTML = `${label} <span class="sort-icon">↕</span>`;
      insertHeaderCell(headerRow, th);

      rows.forEach(row => {
        const info = participantInfoMap[row.dataset.rowId] || {};
        const td = document.createElement('td');
        td.className = `${cls}-td`;
        td.textContent = info[field] || '';
        insertBodyCell(row, td);
      });
    });
  }

  function refreshTableColumns(duration, daysCount, hasSubmissions, submissionsCount, showParticipantInfo) {
    const headerRow = document.getElementById('headRow');
    const rows = document.querySelectorAll('#signups-table tbody tr');

    headerRow.querySelectorAll('.university-th, .degree-th, .location-th, .attendance-th, .submissions-th').forEach(th => th.remove());
    rows.forEach(row => row.querySelectorAll('.university-td, .degree-td, .location-td, .attendance-td, .submissions-td').forEach(td => td.remove()));

    if (showParticipantInfo) renderParticipantInfoColumns(headerRow, rows);
    if (duration !== 'no-attendance') {
      renderAttendanceColumn(headerRow, rows, duration, daysCount);
    }
    if (hasSubmissions) renderSubmissionsColumn(headerRow, rows, submissionsCount);

    updateSortHeaderUI();
    if (currentSort.key && currentSort.dir !== 'none') {
      sortRows();
    } else {
      syncHeaderWidths();
    }
  }

  // The header table has no data of its own, so its column widths are
  // copied from the body table's actual rendered cells after every
  // render. A trailing spacer cell reserves the exact width the vertical
  // scrollbar takes from the body, so columns still line up.
  function syncHeaderWidths() {
    const headRow = document.getElementById('headRow');
    const spacer = document.getElementById('scrollbarSpacer');
    const scrollEl = document.querySelector('.table-scroll');
    const firstBodyRow = document.querySelector('#signups-table tbody tr:not(.hidden)');

    if (firstBodyRow) {
      const headCells = Array.from(headRow.children).filter(el => el !== spacer);
      const bodyCells = Array.from(firstBodyRow.children);
      headCells.forEach((th, i) => {
        if (bodyCells[i]) th.style.width = bodyCells[i].getBoundingClientRect().width + 'px';
      });
    }

    spacer.style.width = (scrollEl.offsetWidth - scrollEl.clientWidth) + 'px';
  }

  // Declared before initConfig() below, since the default sort
  // (currentSort starts on 'status') triggers a sortRows() ->
  // updateSelectionUI() call during that IIFE, which reads these.
  const selectAllRows = document.getElementById('selectAllRows');
  const footerText = document.getElementById('footerText');

  (function initConfig() {
    const cfg = loadConfig();
    applyConfigToModal(cfg);
    refreshTableColumns(cfg.duration, cfg.daysCount, cfg.submissions === 'has-submissions', cfg.submissionsCount, cfg.showParticipantInfo);
  })();
  window.addEventListener('resize', syncHeaderWidths);

  /* Helper tooltips on the status pill + its dropdown options. */
  const STATUS_DESCRIPTIONS = {
    interested: 'Clicked the register button but has not completed the sign-up form',
    applied: 'Completed the sign-up form',
    approved: 'Sign-up form response reviewed and confirmed eligible, but hasn’t started yet',
    completed: 'Complete attendance and/or submissions',
    'dropped-out': 'Left the program before completion',
    rejected: 'Sign-up form response reviewed and found ineligible',
  };

  function applyStatusTooltips() {
    document.querySelectorAll('.status-pill.editable').forEach(pill => {
      pill.dataset.tooltip = STATUS_DESCRIPTIONS[pill.dataset.status] || '';
    });
    document.querySelectorAll('.status-option').forEach(opt => {
      opt.dataset.tooltip = STATUS_DESCRIPTIONS[opt.dataset.status] || '';
    });
  }

  applyStatusTooltips();

  // Runs after admin-common.js's own delegated handler has already updated
  // the *clicked* pill's data-status for this same click, so the tooltip
  // stays in sync. The pill lives either in a table row, or — when this
  // click came from the detail modal instead — nowhere near a <tr> at all,
  // so currentDetailRow is how that case still finds its row.
  document.addEventListener('click', function(e) {
    const opt = e.target.closest('.status-option');
    if (!opt) return;

    applyStatusTooltips();

    const tableRow = opt.closest('tr');
    const row = tableRow || currentDetailRow;
    if (!row) return;

    const newStatus = opt.dataset.status;

    if (!tableRow) {
      // Change came from the modal's own pill — admin-common.js already
      // updated that pill, but the table row's separate pill instance
      // still needs to be mirrored to match.
      const rowPill = row.querySelector('.status-pill');
      if (rowPill) {
        rowPill.dataset.status = newStatus;
        applyPillColor(rowPill);
        const label = rowPill.querySelector('.status-pill-label');
        if (label) label.textContent = statusLabel(newStatus);
      }
    }

    row.dataset.status = newStatus;
    updateRowTimestamp(row);
    logStatusChange(row.dataset.rowId, newStatus);
    if (newStatus === 'approved' || newStatus === 'rejected') {
      logEmailSent(row.dataset.rowId, newStatus);
    }
    updateRejectReasonCell(row, newStatus);
    applyFilter();
    if (currentSort.key && currentSort.dir !== 'none') {
      sortRows();
    }

    if (currentDetailRow === row && document.getElementById('historyModal').classList.contains('show')) {
      renderDetailModal(row);
    }
  });

  function statusLabel(status) {
    return status === 'dropped-out' ? 'Dropped out' : status.charAt(0).toUpperCase() + status.slice(1);
  }

  function logStatusChange(rowId, status) {
    const parts = formatDateTimeParts(new Date());
    const history = statusHistoryStore[rowId] || (statusHistoryStore[rowId] = []);
    history.push({ type: 'status', status, admin: CURRENT_ADMIN, date: parts.date, time: parts.time });
  }

  // Simulates the automatic accept/reject notification email — not an
  // admin action, so it's logged with admin: 'System', same as the mock
  // seed data's synthesized entries.
  function logEmailSent(rowId, status) {
    const parts = formatDateTimeParts(new Date());
    const history = statusHistoryStore[rowId] || (statusHistoryStore[rowId] = []);
    const label = status === 'approved' ? 'Acceptance email sent' : 'Rejection email sent';
    history.push({ type: 'email', label, admin: 'System', date: parts.date, time: parts.time });
  }

  // Reads a created/updated cell's date + time parts directly, rather than
  // relying on incidental whitespace between them in textContent — that
  // whitespace only exists in the initial server-rendered markup and is
  // gone from updateRowTimestamp()'s no-whitespace replacement.
  function formatCellDateTime(cell) {
    if (!cell) return '';
    const time = cell.querySelector('.time-part');
    const date = cell.firstElementChild;
    return time ? `${date.textContent}, ${time.textContent}` : (date ? date.textContent : '');
  }

  function toggleDetailSection(titleEl) {
    titleEl.classList.toggle('collapsed');
  }

  function renderDetailModal(row) {
    currentDetailRow = row;
    const rowId = row.dataset.rowId;
    const p = participantsData.find(x => x.id === rowId);
    document.getElementById('historyModalTitle').textContent = p ? p.name : 'Participant';

    const status = row.dataset.status;
    const createdCell = row.querySelector('.created-at-cell');
    const cfg = loadConfig();

    document.getElementById('modalStatusPill').innerHTML = `
      <span class="status-pill editable small" data-status="${status}" onclick="toggleStatusDropdown(event)">
        <span class="status-pill-label">${statusLabel(status)}</span>
        <div class="status-dropdown" data-statuses="interested,applied,approved,completed,dropped-out,rejected">
          <div class="status-option" data-status="interested">Interested</div>
          <div class="status-option" data-status="applied">Applied</div>
          <div class="status-option" data-status="approved">Approved</div>
          <div class="status-option" data-status="completed">Completed</div>
          <div class="status-option" data-status="dropped-out">Dropped out</div>
          <div class="status-option" data-status="rejected">Rejected</div>
        </div>
      </span>`;

    const rejectReasonRow = status === 'rejected'
      ? `<div class="detail-row"><span class="detail-label">Reject reason</span><span class="detail-value">${rejectReasonStore[rowId] || '—'}</span></div>`
      : '';

    let attendanceRow = '';
    if (cfg.duration === 'single-day') {
      const present = attendanceData[rowId].single;
      attendanceRow = `
        <div class="detail-row detail-row-widget">
          <span class="detail-label">Attendance</span>
          <span class="detail-badge ${present ? 'present' : ''}">${present ? 'Present' : 'Absent'}</span>
        </div>`;
    } else if (cfg.duration === 'multi-day') {
      const chips = attendanceData[rowId].days.map((filled, i) => `
        <span class="detail-chip ${filled ? 'filled-attendance' : ''}" data-tooltip="${formatDayDate(i)}">${i + 1}</span>
      `).join('');
      attendanceRow = `
        <div class="detail-row detail-row-widget">
          <span class="detail-label">Attendance</span>
          <span class="detail-chip-row">${chips}</span>
        </div>`;
    }

    let submissionsRow = '';
    if (cfg.submissions === 'has-submissions') {
      const chips = submissionsData[rowId].map((done, i) => `
        <span class="detail-chip ${done ? 'filled-submission' : ''}" data-tooltip="${taskLabel(i)}">${i + 1}</span>
      `).join('');
      submissionsRow = `
        <div class="detail-row detail-row-widget">
          <span class="detail-label">Submissions</span>
          <span class="detail-chip-row">${chips}</span>
        </div>`;
    }

    document.getElementById('detailList').innerHTML = `
      ${rejectReasonRow ? `<div class="detail-group">${rejectReasonRow}</div>` : ''}
      <div class="detail-section-title collapsible" onclick="toggleDetailSection(this)">
        <span>Info</span>
        <span class="detail-section-chevron">▾</span>
      </div>
      <div class="detail-group">
        <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${p.email}</span></div>
        <div class="detail-row"><span class="detail-label">School</span><span class="detail-value">${p.school}</span></div>
        <div class="detail-row"><span class="detail-label">Course</span><span class="detail-value">${p.course}</span></div>
        <div class="detail-row"><span class="detail-label">Location</span><span class="detail-value">${p.location}</span></div>
        <div class="detail-row"><span class="detail-label">Created</span><span class="detail-value">${formatCellDateTime(createdCell)}</span></div>
        ${attendanceRow}
        ${submissionsRow}
      </div>
    `;

    applyStatusTooltips();
    const newPill = document.getElementById('modalStatusPill').querySelector('.status-pill');
    if (newPill) applyPillColor(newPill);

    renderHistoryList(rowId);
  }

  function renderHistoryList(rowId) {
    const history = statusHistoryStore[rowId] || [];
    const listEl = document.getElementById('historyList');

    if (!history.length) {
      listEl.innerHTML = '<div class="history-empty">No status changes recorded yet.</div>';
      return;
    }

    listEl.innerHTML = history.slice().reverse().map(entry => {
      const statusText = entry.type === 'email'
        ? `<span class="history-status history-email">✉ ${entry.label}</span>`
        : `<span class="history-status">${statusLabel(entry.status)}</span>`;

      return `
        <div class="history-entry">
          <div class="history-entry-main">
            ${statusText}
            <span class="history-admin">${entry.admin}</span>
          </div>
          <div class="history-timestamp">${entry.date}, ${entry.time}</div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('historyModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal('historyModal');
  });

  /* Dynamic custom tooltip to prevent clipping by overflow: auto container */
  const tooltipEl = document.createElement('div');
  tooltipEl.className = 'custom-tooltip';
  document.body.appendChild(tooltipEl);

  let activeTooltipTarget = null;

  function positionTooltip(target) {
    const rect = target.getBoundingClientRect();
    const tooltipRect = tooltipEl.getBoundingClientRect();

    if (target.classList.contains('status-option')) {
      // Side tooltip
      const top = rect.top + (rect.height - tooltipRect.height) / 2;
      const left = rect.right + 6;
      tooltipEl.style.top = top + 'px';
      tooltipEl.style.left = left + 'px';
    } else {
      // Top tooltip
      const top = rect.top - tooltipRect.height - 6;
      const left = rect.left + (rect.width - tooltipRect.width) / 2;
      tooltipEl.style.top = top + 'px';
      tooltipEl.style.left = left + 'px';
    }
  }

  function hideTooltip() {
    tooltipEl.classList.remove('show');
    activeTooltipTarget = null;
  }

  document.addEventListener('mouseover', function(e) {
    const target = e.target.closest('[data-tooltip]');
    if (!target) return;

    // Suppress tooltip if it's a status pill and its dropdown is open
    if (target.classList.contains('status-pill') && target.querySelector('.status-dropdown.show')) {
      hideTooltip();
      return;
    }

    activeTooltipTarget = target;
    tooltipEl.textContent = target.dataset.tooltip;
    tooltipEl.classList.add('show');
    positionTooltip(target);
  });

  document.addEventListener('mouseout', function(e) {
    if (activeTooltipTarget && !e.target.closest('[data-tooltip]')) {
      hideTooltip();
    }
  });

  // Sync header horizontal scroll with body scroll
  const tableHeadScroll = document.querySelector('.table-head-scroll');
  const tableScroll = document.querySelector('.table-scroll');
  if (tableScroll && tableHeadScroll) {
    tableScroll.addEventListener('scroll', () => {
      tableHeadScroll.scrollLeft = tableScroll.scrollLeft;
    });
  }

  // Hide or reposition tooltip on scroll inside the table body
  if (tableScroll) {
    tableScroll.addEventListener('scroll', () => {
      if (activeTooltipTarget) {
        const rect = activeTooltipTarget.getBoundingClientRect();
        const scrollRect = tableScroll.getBoundingClientRect();
        // If the hovered element is scrolled out of the visible area of table-scroll, hide the tooltip
        if (rect.bottom < scrollRect.top || rect.top > scrollRect.bottom) {
          hideTooltip();
        } else {
          positionTooltip(activeTooltipTarget);
        }
      }
    });
  }

  window.addEventListener('resize', hideTooltip);

  /* Bulk row selection + footer counts. */
  function rowCheckboxes() {
    return Array.from(document.querySelectorAll('#signups-table tbody tr:not(.hidden) .row-select'));
  }

  function updateSelectionUI() {
    const boxes = rowCheckboxes();
    const total = boxes.length;
    const selectedCount = boxes.filter(cb => cb.checked).length;

    selectAllRows.checked = total > 0 && selectedCount === total;
    selectAllRows.indeterminate = selectedCount > 0 && selectedCount < total;

    if (selectedCount > 0) {
      footerText.innerHTML = '<span class="footer-selected-count">' + selectedCount + ' selected</span> of ' + total + ' rows';
    } else {
      footerText.textContent = total + ' rows';
    }
  }

  selectAllRows.addEventListener('change', function() {
    rowCheckboxes().forEach(cb => { cb.checked = this.checked; });
    updateSelectionUI();
  });

  document.querySelectorAll('#signups-table tbody .row-select').forEach(cb => cb.addEventListener('change', updateSelectionUI));

  updateSelectionUI();

  /* ── Info filter ──────────────────────────────────────────────────────── */
  const INFO_FIELDS = [
    { key: 'university', label: 'University', dataKey: 'school'    },
    { key: 'degree',     label: 'Degree',     dataKey: 'course'    },
    { key: 'location',   label: 'Location',   dataKey: 'location'  },
  ];

  // Unique sorted values for each field derived from the data
  const infoValues = {};
  INFO_FIELDS.forEach(({ key, dataKey }) => {
    infoValues[key] = [...new Set(participantsData.map(p => p[dataKey]).filter(Boolean))].sort();
  });

  // Included values per field — full set = no filtering on that field
  const infoFilterState = {};
  INFO_FIELDS.forEach(({ key }) => {
    infoFilterState[key] = new Set(infoValues[key]);
  });

  function isInfoFilterActive() {
    return INFO_FIELDS.some(({ key }) => infoFilterState[key].size < infoValues[key].length);
  }

  function updateInfoFilterButton() {
    const btn = document.getElementById('infoFilterBtn');
    const badge = document.getElementById('infoFilterBadge');
    const active = isInfoFilterActive();
    btn.classList.toggle('filter-active', active);
    if (active) {
      const excluded = INFO_FIELDS.reduce((n, { key }) => n + (infoValues[key].length - infoFilterState[key].size), 0);
      badge.textContent = excluded;
    }
  }

  function buildInfoFilterModal() {
    const container = document.getElementById('infoFilterSections');
    container.innerHTML = '';

    INFO_FIELDS.forEach(({ key, label }) => {
      const values = infoValues[key];

      const section = document.createElement('div');
      section.className = 'info-filter-section';

      const header = document.createElement('div');
      header.className = 'info-filter-section-header';
      header.innerHTML = `
        <span class="info-filter-section-title">${label}</span>
        <div class="info-filter-section-actions">
          <button type="button" class="info-filter-quick-btn" data-action="all" data-field="${key}">All</button>
          <span class="info-filter-divider">·</span>
          <button type="button" class="info-filter-quick-btn" data-action="none" data-field="${key}">None</button>
        </div>`;
      section.appendChild(header);

      const list = document.createElement('div');
      list.className = 'info-filter-list';

      values.forEach(val => {
        const lbl = document.createElement('label');
        lbl.className = 'info-filter-option' + (infoFilterState[key].has(val) ? '' : ' excluded');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = infoFilterState[key].has(val);
        cb.addEventListener('change', () => {
          if (cb.checked) {
            infoFilterState[key].add(val);
            lbl.classList.remove('excluded');
          } else {
            infoFilterState[key].delete(val);
            lbl.classList.add('excluded');
          }
          applyFilter();
          updateInfoFilterButton();
        });
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(' ' + val));
        list.appendChild(lbl);
      });

      section.appendChild(list);
      container.appendChild(section);

      header.querySelectorAll('.info-filter-quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const all = btn.dataset.action === 'all';
          infoFilterState[key] = all ? new Set(values) : new Set();
          list.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = all; });
          list.querySelectorAll('.info-filter-option').forEach(lbl => {
            lbl.classList.toggle('excluded', !all);
          });
          applyFilter();
          updateInfoFilterButton();
        });
      });
    });
  }

  function openInfoFilterModal() {
    buildInfoFilterModal();
    openModal('infoFilterModal');
  }

  function resetInfoFilter() {
    INFO_FIELDS.forEach(({ key }) => {
      infoFilterState[key] = new Set(infoValues[key]);
    });
    buildInfoFilterModal();
    applyFilter();
    updateInfoFilterButton();
  }

  function applyFilter() {
    const filterVal = document.getElementById('statusFilter').value;
    const searchVal = document.getElementById('searchFilter').value.trim().toLowerCase();
    const rows = document.querySelectorAll('#signups-table tbody tr');

    rows.forEach(row => {
      const pill = row.querySelector('.status-pill');
      const status = pill ? pill.dataset.status : '';
      const statusMatch = filterVal === 'all' || status === filterVal;

      let searchMatch = true;
      if (searchVal) {
        const name       = (row.querySelector('.participant-name')?.textContent  || '').toLowerCase();
        const email      = (row.querySelector('.participant-email')?.textContent || '').toLowerCase();
        const university = (row.querySelector('.university-td')?.textContent     || '').toLowerCase();
        const degree     = (row.querySelector('.degree-td')?.textContent         || '').toLowerCase();
        const location   = (row.querySelector('.location-td')?.textContent       || '').toLowerCase();
        searchMatch = name.includes(searchVal) || email.includes(searchVal) ||
                      university.includes(searchVal) || degree.includes(searchVal) ||
                      location.includes(searchVal);
      }

      let infoMatch = true;
      if (isInfoFilterActive()) {
        const info = participantInfoMap[row.dataset.rowId] || {};
        infoMatch = INFO_FIELDS.every(({ key, dataKey }) => {
          const state = infoFilterState[key];
          if (state.size === infoValues[key].length) return true; // full set = no filter
          return state.has(info[dataKey] || '');
        });
      }

      row.classList.toggle('hidden', !(statusMatch && searchMatch && infoMatch));
    });

    updateSelectionUI();
    syncHeaderWidths();
  }

  document.getElementById('statusFilter').addEventListener('change', applyFilter);
  document.getElementById('searchFilter').addEventListener('input', applyFilter);

  // Selection is scoped to the checkbox column only — clicking anywhere in
  // that cell (not just the checkbox itself) toggles it. Clicking anywhere
  // else in the row, including the Name/email column, opens that
  // participant's detail modal — except interactive controls within the
  // row (status pill/dropdown, attendance/submission buttons), which
  // should only do their own thing, not also open the modal.
  document.querySelectorAll('#signups-table tbody tr').forEach(row => {
    row.addEventListener('click', function(e) {
      const selectCell = e.target.closest('.select-col');
      if (selectCell) {
        if (e.target.classList.contains('row-select')) return; // native toggle already handles this
        const checkbox = row.querySelector('.row-select');
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
        return;
      }

      const excluded = e.target.closest(
        '.status-pill, .attendance-day-btn, .submission-btn, .attendance-checkbox'
      );
      if (excluded) return;

      renderDetailModal(row);
      openModal('historyModal');
    });
  });
</script>

</body>
</html>
