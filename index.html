<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="prototypes/assets/admin-common.css">
    <title>Home Page</title>
    <style>
        .container {
            max-width: 800px;
        }

        .tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* One accent per tile, used for the focus ring, hover border and the illustration's fills. */
        .tile {
            --accent: #2563eb;
            --tint: #dbeafe;
            display: block;
            padding: 24px;
            background: white;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            color: #1d1d1f;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .tile-tickets {
            --accent: #ea580c;
            --tint: #ffedd5;
        }

        .tile:hover {
            transform: translateY(-4px) rotate(-0.6deg);
            border-color: var(--accent);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
        }

        .tile:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .tile h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 16px 0 4px;
        }

        .tile p {
            font-size: 14px;
            color: #6e6e73;
        }

        .art {
            display: block;
            width: 100%;
            height: auto;
            fill: none;
            stroke: #1d1d1f;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .art .fill { fill: var(--tint); stroke: none; }
        .art .solid { fill: white; }
        .art .accent { stroke: var(--accent); stroke-width: 3.2; }
        .art .thin { stroke-width: 1.6; }

        /* Hover nudges one loose piece of each sketch, as if it were still being drawn. */
        .art .move {
            transition: transform 0.25s ease;
            transform-box: fill-box;
            transform-origin: center;
        }

        .tile-prototypes:hover .move { transform: translate(-10px, -8px) rotate(-6deg); }
        .tile-tickets:hover .move { transform: translate(4px, -6px) rotate(4deg); }

        @media (max-width: 640px) {
            .tiles {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tile,
            .art .move {
                transition: none;
            }

            .tile:hover,
            .tile-prototypes:hover .move,
            .tile-tickets:hover .move {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-header-content" style="margin-bottom: 32px;">
            <h1 class="page-title">Product</h1>
            <p class="page-subtitle">Prototypes and tickets</p>
        </div>

                <p>Clickable mockups of key screens.</p>
            </a>

            <a class="tile tile-tickets" href="tickets/index.html">

</body>
</html>
